<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 580" width="920" height="580" role="img" aria-label="Windows 11 Settings: Ethernet IP assignment to Manual, with IPv4 address, subnet mask and blank gateway">
  <rect x="0" y="0" width="920" height="560" fill="#0A0C0B"/>

  <!-- ══ LEFT: Windows 11 Settings window ══ -->
  <rect x="14" y="42" width="452" height="500" rx="8" fill="#FFFFFF" stroke="#DADADA"/>
  <!-- title bar -->
  <path d="M14 50 a8 8 0 0 1 8 -8 h436 a8 8 0 0 1 8 8 v22 h-452 z" fill="#FAFAFA"/>
  <line x1="14" y1="72" x2="466" y2="72" stroke="#EFEFEF"/>
  <text x="30" y="60" fill="#3B3B3B" font-family="'Segoe UI', Tahoma, sans-serif" font-size="12">Settings</text>
  <path d="M406 64 h11" stroke="#5A5A5A" stroke-width="1"/>
  <rect x="428" y="57" width="10" height="10" fill="none" stroke="#5A5A5A"/>
  <path d="M449 57 l10 10 M459 57 l-10 10" stroke="#5A5A5A" stroke-width="1"/>

  <!-- nav -->
  <path d="M14 72 h146 v470 h-146 z" fill="#FBFBFB"/>
  <line x1="160" y1="72" x2="160" y2="542" stroke="#EFEFEF"/>
  <rect x="26" y="86" width="122" height="26" rx="5" fill="#FFFFFF" stroke="#E4E4E4"/>
  <circle cx="38" cy="99" r="4" fill="none" stroke="#9A9A9A" stroke-width="1.2"/>
  <line x1="41" y1="102" x2="44" y2="105" stroke="#9A9A9A" stroke-width="1.2"/>
  <text x="50" y="102" fill="#8A8A8A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">Find a setting</text>

  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">
    <text x="30" y="134" fill="#434343">Home</text>
    <text x="30" y="166" fill="#434343">System</text>
    <text x="30" y="198" fill="#434343">Bluetooth &amp; devices</text>
    <rect x="20" y="210" width="132" height="26" rx="5" fill="#E8F0FB"/>
    <rect x="20" y="210" width="3" height="26" rx="1.5" fill="#0067C0"/>
    <text x="30" y="227" fill="#0067C0" font-weight="600">Network &amp; internet</text>
    <text x="30" y="256" fill="#434343">Notifications</text>
    <text x="30" y="286" fill="#434343">Sound</text>
    <text x="30" y="316" fill="#434343">Focus</text>
    <text x="30" y="346" fill="#434343">Privacy &amp; security</text>
    <text x="30" y="376" fill="#434343">Time &amp; language</text>
  </g>

  <!-- content -->
  <text x="176" y="96" fill="#5A5A5A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Network &amp; internet &#8250; Ethernet</text>
  <text x="176" y="122" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="16" font-weight="600">Ethernet</text>

  <rect x="174" y="140" width="272" height="128" rx="8" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="190" y="166" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5" font-weight="600">IP assignment</text>
  <text x="190" y="192" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11.5">Automatic (DHCP)</text>
  <text x="190" y="210" fill="#767676" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">IPv4 10.20.30.15 — assigned by DHCP</text>
  <text x="190" y="224" fill="#767676" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">Gateway 192.168.1.1</text>
  <rect x="190" y="238" width="130" height="20" rx="4" fill="#FDECEA"/>
  <text x="198" y="252" fill="#B32218" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">Wrong subnet for BMS</text>
  <rect x="392" y="156" width="46" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0"/>
  <text x="415" y="174" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">Edit</text>

  <rect x="174" y="284" width="272" height="164" rx="8" fill="#FFFFFF" stroke="#E6E6E6"/>
  <text x="190" y="310" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5" font-weight="600">Related settings</text>
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="10" fill="#0067C0">
    <text x="190" y="340">Network adapters</text>
    <text x="190" y="372">Advanced network settings</text>
    <text x="190" y="404">Network diagnostics</text>
  </g>
  <rect x="174" y="464" width="272" height="58" rx="8" fill="#F5F5F5"/>
  <text x="190" y="488" fill="#3B3B3B" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5" font-weight="600">Faster route on any Windows</text>
  <text x="190" y="506" fill="#5A5A5A" font-family="Consolas, monospace" font-size="9.5">Win + R  &#8250;  ncsi.cpl</text>

  <!-- ══ RIGHT: Edit IP settings dialog ══ -->
  <rect x="486" y="36" width="424" height="500" rx="8" fill="#000000" opacity="0.35"/>
  <rect x="490" y="30" width="420" height="500" rx="8" fill="#FFFFFF" stroke="#CFCFCF"/>
  <path d="M490 38 a8 8 0 0 1 8 -8 h404 a8 8 0 0 1 8 8 v30 h-420 z" fill="#FAFAFA"/>
  <line x1="490" y1="68" x2="910" y2="68" stroke="#EFEFEF"/>
  <text x="508" y="58" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="12.5">Edit IP settings</text>

  <text x="522" y="94" fill="#3C3C3C" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10" font-weight="600">IP type</text>
  <circle cx="532" cy="114" r="6.5" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="1.3"/>
  <text x="548" y="118" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5">Automatic (DHCP)</text>
  <circle cx="532" cy="146" r="6.5" fill="#FFFFFF" stroke="#0067C0" stroke-width="1.8"/>
  <circle cx="532" cy="146" r="3" fill="#0067C0"/>
  <text x="548" y="150" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5" font-weight="600">Manual</text>

  <line x1="508" y1="172" x2="892" y2="172" stroke="#EDEDED"/>

  <rect x="520" y="184" width="44" height="24" rx="12" fill="#F0F0F0" stroke="#DCDCDC"/>
  <text x="542" y="200" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">IPv4</text>
  <text x="574" y="200" fill="#767676" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9">Address type: IPv4 &#8250; leave IPv6 on Automatic</text>

  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="10" fill="#3C3C3C">
    <text x="520" y="232">IP address</text>
    <text x="520" y="274">Subnet mask</text>
    <text x="520" y="316">Gateway</text>
    <text x="520" y="358">Preferred DNS</text>
  </g>
  <rect x="644" y="216" width="248" height="28" rx="4" fill="#FFFFFF" stroke="#0067C0" stroke-width="1.6"/>
  <text x="654" y="235" fill="#1A1A1A" font-family="Consolas, monospace" font-size="11">10.20.30.200</text>
  <rect x="644" y="258" width="248" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0"/>
  <text x="654" y="277" fill="#1A1A1A" font-family="Consolas, monospace" font-size="11">255.255.255.0</text>
  <rect x="644" y="300" width="248" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0" stroke-dasharray="3 3"/>
  <text x="654" y="319" fill="#9A9A9A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">leave blank — do not fill in the router</text>
  <rect x="644" y="342" width="248" height="28" rx="4" fill="#FFFFFF" stroke="#D0D0D0" stroke-dasharray="3 3"/>
  <text x="654" y="361" fill="#9A9A9A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">leave blank</text>

  <rect x="520" y="392" width="44" height="24" rx="12" fill="#F0F0F0" stroke="#DCDCDC"/>
  <text x="542" y="408" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">IPv6</text>
  <text x="574" y="408" fill="#767676" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9">Automatic (DHCP) — no change needed</text>

  <rect x="792" y="484" width="72" height="30" rx="4" fill="#0067C0"/>
  <text x="828" y="503" text-anchor="middle" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5">Save</text>
  <rect x="710" y="484" width="72" height="30" rx="4" fill="#FFFFFF" stroke="#D0D0D0"/>
  <text x="746" y="503" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5">Cancel</text>

  <!-- ══ step badges ══ -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="458" cy="170" r="11" fill="#00e696"/><text x="458" y="174" fill="#04140F">1</text>
    <circle cx="506" cy="146" r="11" fill="#00e696"/><text x="506" y="150" fill="#04140F">2</text>
    <circle cx="626" cy="230" r="11" fill="#00e696"/><text x="626" y="234" fill="#04140F">3</text>
    <circle cx="626" cy="272" r="11" fill="#00e696"/><text x="626" y="276" fill="#04140F">4</text>
    <circle cx="626" cy="314" r="11" fill="#00e696"/><text x="626" y="318" fill="#04140F">5</text>
    <circle cx="698" cy="499" r="11" fill="#00e696"/><text x="698" y="503" fill="#04140F">6</text>
  </g>

  <text x="20" y="566" fill="#5C6763" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">示意图 (schematic) — redrawn from the Windows 11 Settings layout; labels and spacing are simplified.</text>
</svg>
