<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="BACnet MS/TP RS-485 wiring with USB-RS485 adapter and YABE COM port setup">
  <rect x="0" y="0" width="920" height="560" fill="#0A0C0B"/>

  <!-- ══ Panel A: RS-485 branch ══ -->
  <rect x="14" y="36" width="470" height="496" rx="8" fill="#0E1210" stroke="rgba(255,255,255,0.1)"/>
  <text x="30" y="62" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="14" font-weight="600">BACnet MS/TP (RS-485) branch</text>
  <text x="30" y="82" fill="#9AA5A0" font-family="'Segoe UI', Tahoma, sans-serif" font-size="11">No IP on this bus — the laptop talks serial, so skip sections 3 and 4.</text>

  <!-- laptop -->
  <rect x="36" y="104" width="112" height="62" rx="6" fill="#111614" stroke="rgba(255,255,255,0.2)"/>
  <rect x="48" y="114" width="88" height="40" rx="3" fill="#0A0C0B" stroke="rgba(255,255,255,0.14)"/>
  <text x="92" y="160" text-anchor="middle" fill="#9AA5A0" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">Windows laptop</text>
  <path d="M92 166 v34" stroke="#00e696" stroke-width="1.6" fill="none"/>
  <text x="100" y="184" fill="#00e696" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">USB</text>

  <!-- adapter -->
  <rect x="34" y="200" width="116" height="56" rx="6" fill="#00e696" opacity="0.14"/>
  <rect x="34" y="200" width="116" height="56" rx="6" fill="none" stroke="#00e696" stroke-width="1.5"/>
  <text x="46" y="222" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5" font-weight="600">USB-RS485</text>
  <text x="46" y="238" fill="#00e696" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">FTDI / CH340</text>
  <text x="46" y="250" fill="#9AA5A0" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">isolated type preferred</text>

  <!-- terminals -->
  <path d="M150 212 h26" stroke="#FF6B6B" stroke-width="1.6"/>
  <circle cx="186" cy="212" r="3.5" fill="#FF6B6B"/>
  <text x="196" y="216" fill="#FF6B6B" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10" font-weight="600">A</text>
  <path d="M150 230 h26" stroke="#00bfff" stroke-width="1.6"/>
  <circle cx="186" cy="230" r="3.5" fill="#00bfff"/>
  <text x="196" y="234" fill="#00bfff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10" font-weight="600">B</text>
  <path d="M150 246 h26" stroke="#C8D0CC" stroke-width="1.4" stroke-dasharray="3 2"/>
  <circle cx="186" cy="246" r="3.5" fill="#C8D0CC"/>
  <text x="196" y="250" fill="#C8D0CC" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">SHD</text>

  <!-- trunk -->
  <path d="M92 256 v40" stroke="#00e696" stroke-width="1.6" fill="none"/>
  <path d="M40 296 h424" stroke="#FF6B6B" stroke-width="1.8"/>
  <path d="M40 306 h424" stroke="#00bfff" stroke-width="1.8"/>
  <text x="452" y="293" text-anchor="end" fill="#FF6B6B" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9">A</text>
  <text x="452" y="322" text-anchor="end" fill="#00bfff" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9">B</text>

  <!-- taps + devices -->
  <g stroke="rgba(255,255,255,0.14)" stroke-width="1.2">
    <path d="M76 306 v30"/><path d="M192 306 v30"/><path d="M308 306 v30"/><path d="M424 306 v30"/>
  </g>
  <g>
    <rect x="40" y="336" width="76" height="52" rx="6" fill="#111614" stroke="#00e696" stroke-width="1.3"/>
    <text x="50" y="358" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">Device 71</text>
    <text x="50" y="376" fill="#9AA5A0" font-family="Consolas, monospace" font-size="9">addr 71</text>

    <rect x="156" y="336" width="76" height="52" rx="6" fill="#111614" stroke="#00e696" stroke-width="1.3"/>
    <text x="166" y="358" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">Device 72</text>
    <text x="166" y="376" fill="#9AA5A0" font-family="Consolas, monospace" font-size="9">addr 72</text>

    <rect x="272" y="336" width="76" height="52" rx="6" fill="#111614" stroke="#00e696" stroke-width="1.3"/>
    <text x="282" y="358" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">Device 73</text>
    <text x="282" y="376" fill="#9AA5A0" font-family="Consolas, monospace" font-size="9">addr 73</text>

    <rect x="388" y="336" width="76" height="52" rx="6" fill="#111614" stroke="#00e696" stroke-width="1.3"/>
    <text x="398" y="358" fill="#FFFFFF" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">Device 4</text>
    <text x="398" y="376" fill="#9AA5A0" font-family="Consolas, monospace" font-size="9">addr 4</text>
  </g>

  <!-- terminations -->
  <rect x="34" y="288" width="12" height="26" rx="2" fill="#FFBe32" opacity="0.25" stroke="#FFBe32" stroke-width="1.3"/>
  <text x="40" y="281" text-anchor="middle" fill="#FFBe32" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">120&#937;</text>
  <rect x="458" y="288" width="12" height="26" rx="2" fill="#FFBe32" opacity="0.25" stroke="#FFBe32" stroke-width="1.3"/>
  <text x="464" y="332" text-anchor="middle" fill="#FFBe32" font-family="'Segoe UI', Tahoma, sans-serif" font-size="8.5">120&#937;</text>

  <!-- rules -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">
    <text x="30" y="416" fill="#FF6B6B" font-weight="600">&#10007; A and B swapped &#8594; nothing scans</text>
    <text x="30" y="432" fill="#9AA5A0">Swap the pair at the adapter and retry — it costs nothing.</text>
    <text x="30" y="456" fill="#FFBe32" font-weight="600">&#9650; 120 &#937; at the first and last device only</text>
    <text x="30" y="472" fill="#9AA5A0">Bias / fail-safe resistors at one end of the trunk only.</text>
    <text x="30" y="496" fill="#9AA5A0" font-weight="600">Shield (SHD) bonded at the panel end only — one end, or you</text>
    <text x="30" y="510" fill="#9AA5A0">create a ground loop.</text>
  </g>
  <rect x="26" y="426" width="446" height="1" fill="rgba(255,255,255,0.08)"/>

  <!-- ══ Panel B: YABE MS/TP dialog ══ -->
  <rect x="500" y="36" width="406" height="496" rx="8" fill="#F0F0F0" stroke="#A8A8A8"/>
  <rect x="500" y="36" width="406" height="28" fill="#F5F5F5"/>
  <line x1="500" y1="64" x2="906" y2="64" stroke="#D2D2D2"/>
  <text x="512" y="55" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10.5">Add device — BACnet/MS/TP</text>

  <text x="516" y="90" fill="#3B3B3B" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5" font-weight="600">Serial port</text>
  <rect x="516" y="98" width="270" height="24" rx="3" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="526" y="114" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">COM3 — FTDI USB-RS485</text>
  <rect x="770" y="98" width="16" height="24" fill="#E4E4E4"/>
  <path d="M774 108 l4 4 l4 -4" fill="none" stroke="#404040" stroke-width="1.2"/>

  <rect x="516" y="132" width="180" height="24" rx="3" fill="#FFFFFF" stroke="#B0B0B0" stroke-dasharray="3 3"/>
  <text x="526" y="148" fill="#A0A0A0" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">not added yet</text>
  <rect x="706" y="132" width="66" height="24" rx="3" fill="#FFFFFF" stroke="#0067C0"/>
  <text x="739" y="148" text-anchor="middle" fill="#0067C0" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Add</text>

  <rect x="516" y="172" width="374" height="88" rx="4" fill="#FAFAFA" stroke="#C8C8C8"/>
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5" fill="#606060">
    <text x="528" y="192">Source address</text>
    <text x="528" y="216">Free addresses</text>
    <text x="528" y="240">MSTP speed</text>
  </g>
  <rect x="662" y="178" width="86" height="22" rx="3" fill="#FFFFFF" stroke="#0067C0" stroke-width="1.5"/>
  <text x="672" y="193" fill="#B32218" font-family="Consolas, monospace" font-size="9.5">-1 ?</text>
  <text x="756" y="193" fill="#606060" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9">YABE asks you to set one</text>
  <rect x="662" y="202" width="14" height="14" rx="2" fill="#0067C0"/>
  <path d="M665 209 l4 4 l7 -8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  <text x="684" y="213" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">shown in the tree</text>
  <text x="662" y="240" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Auto, or 115200 / 38400 / 9600</text>

  <rect x="516" y="274" width="374" height="92" rx="4" fill="#FFF8E1" stroke="#E0BE62"/>
  <text x="528" y="294" fill="#7A5B00" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5" font-weight="600">The source address must be one nobody else uses</text>
  <text x="528" y="312" fill="#7A5B00" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Any MAC from 0 to 254 that is not a real device. YABE lists the</text>
  <text x="528" y="326" fill="#7A5B00" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">free ones in the tree, and shows unanswered PollForMaster calls,</text>
  <text x="528" y="340" fill="#7A5B00" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">so you can read the bus traffic and pick a safe number.</text>
  <text x="528" y="358" fill="#7A5B00" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Using a live MAC number breaks the network for everyone else.</text>

  <rect x="516" y="378" width="374" height="76" rx="4" fill="#F0F8F4" stroke="#00b894"/>
  <text x="528" y="398" fill="#00795C" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5" font-weight="600">On site</text>
  <text x="528" y="414" fill="#20604F" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Tie in at an existing panel, never by cutting a live trunk.</text>
  <text x="528" y="428" fill="#20604F" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Do not unplug MS/TP while the building is running: the bus</text>
  <text x="528" y="442" fill="#20604F" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">stops polling and every controller reports a comm loss.</text>

  <rect x="516" y="450" width="374" height="0" fill="none"/>
  <rect x="516" y="478" width="76" height="24" rx="3" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="554" y="494" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Cancel</text>
  <rect x="600" y="478" width="140" height="24" rx="3" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="670" y="494" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">MSTP state machine log</text>
  <rect x="748" y="478" width="90" height="24" rx="3" fill="#FFFFFF" stroke="#8A8A8A"/>
  <text x="793" y="494" text-anchor="middle" fill="#1A1A1A" font-family="'Segoe UI', Tahoma, sans-serif" font-size="9.5">Close</text>

  <!-- badges -->
  <g font-family="'Segoe UI', Tahoma, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="24" cy="228" r="11" fill="#00e696"/><text x="24" y="232" fill="#04140F">1</text>
    <circle cx="88" cy="281" r="11" fill="#00e696"/><text x="88" y="285" fill="#04140F">2</text>
    <circle cx="498" cy="110" r="11" fill="#00e696"/><text x="498" y="114" fill="#04140F">3</text>
    <circle cx="790" cy="144" r="11" fill="#00e696"/><text x="790" y="148" fill="#04140F">4</text>
  </g>

  <text x="20" y="552" fill="#5C6763" font-family="'Segoe UI', Tahoma, sans-serif" font-size="10">示意图 (schematic) — wiring and dialog layout redrawn for teaching; the wiring rules are the ones that actually matter.</text>
</svg>
